<!-- ===== ЗНАЧКИ ПРОГРАММ: вставь этот блок прямо перед </body> ===== -->
<style>
  .tool{display:inline-flex;align-items:center;gap:10px}
  .tool .ti{width:22px;height:22px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--accent,#c8a978)}
  .tool .ti svg,.tool .ti img{width:22px;height:22px;display:block;object-fit:contain}
</style>
<script>
(function(){
  /* Значки программ. Чтобы поставить свой значок: положи файл assets/icons/<имя>.svg
     (или .png) — он заменит стандартный. Имена файлов — во втором столбце. */
  const ICON={
    cad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L17 4l3 3L8 19z"/><path d="M14 7l3 3"/><path d="M4 20h6"/></svg>',
    cube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
    render:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',
    game:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="3"/><path d="M8 10v5M5.5 12.5h5M15.5 11h.01M18 14h.01"/></svg>',
    image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>',
    vector:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c2-9 5-13 14-14"/><rect x="3" y="17" width="4" height="4" rx=".5"/><rect x="17" y="3" width="4" height="4" rx=".5"/></svg>',
    video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>',
    furniture:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M12 3v18M5 12h14M9.5 7.5v1M14.5 7.5v1M9.5 16v1M14.5 16v1"/></svg>'
  };
  /* название на сайте : [значок по умолчанию, имя файла для своего значка] */
  const MAP={
    'SolidWorks':['cad','solidworks'],'AutoCAD':['cad','autocad'],'Базис-Мебельщик':['furniture','bazis'],
    '3ds Max':['cube','3dsmax'],'Corona Renderer':['render','corona'],'Blender':['cube','blender'],
    'SketchUp':['cube','sketchup'],'Unreal Engine':['game','unreal'],
    'Adobe Photoshop':['image','photoshop'],'CorelDRAW':['vector','coreldraw'],'Adobe Premiere Pro':['video','premiere']
  };
  document.querySelectorAll('.tool').forEach(function(el){
    const name=el.textContent.trim(), m=MAP[name]; if(!m||el.querySelector('.ti')) return;
    const box=document.createElement('span'); box.className='ti'; box.setAttribute('aria-hidden','true'); box.innerHTML=ICON[m[0]];
    el.insertBefore(box,el.firstChild);
    [m[1]+'.svg',m[1]+'.png'].reduce(function(prev,f){return prev.then(function(ok){
      if(ok) return true;
      return new Promise(function(res){const im=new Image();im.onload=function(){box.innerHTML='';box.appendChild(im);res(true)};im.onerror=function(){res(false)};im.alt='';im.src='assets/icons/'+f;});
    })},Promise.resolve(false));
  });
})();
</script>
